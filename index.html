  <style>
  /* Warm Canvas · design tokens (alpha) —— 奶油画布 / 珊瑚 / 深色产品面 */
  :root {
    /* colors */
    --color-primary: #cc785c;
    --color-primary-active: #a9583e;
    --color-primary-disabled: #e6dfd8;
    --color-ink: #141413;
    --color-body: #3d3d3a;
    --color-body-strong: #252523;
    --color-muted: #6c6a64;
    --color-muted-soft: #8e8b82;
    --color-hairline: #e6dfd8;
    --color-hairline-soft: #ebe6df;
    --color-canvas: #faf9f5;
    --color-surface-soft: #f5f0e8;
    --color-surface-card: #efe9de;
    --color-surface-cream-strong: #e8e0d2;
    --color-surface-dark: #181715;
    --color-surface-dark-elevated: #252320;
    --color-surface-dark-soft: #1f1e1b;
    --color-on-primary: #ffffff;
    --color-on-dark: #faf9f5;
    --color-on-dark-soft: #a09d96;
    --color-success: #5db872;
    --color-warning: #d4a017;
    --color-error: #c64545;

    /* 应用内部短名，全部指向 Warm Canvas 令牌 */
    --primary: var(--color-primary);
    --primary-active: var(--color-primary-active);
    --primary-disabled: var(--color-primary-disabled);
    --ink: var(--color-ink);
    --body: var(--color-body);
    --muted: var(--color-muted);
    --hairline: var(--color-hairline);
    --hairline-soft: var(--color-hairline-soft);
    --canvas: var(--color-canvas);
    --surface-card: var(--color-surface-card);
    --surface-soft: var(--color-surface-soft);
    --surface-dark: var(--color-surface-dark);
    --surface-dark-elevated: var(--color-surface-dark-elevated);
    --on-dark: var(--color-on-dark);
    --on-dark-soft: var(--color-on-dark-soft);
    --success: var(--color-success);
    --error: var(--color-error);

    /* font families（含中文回退） */
    --font-display: "Copernicus", "Tiempos Headline", "Cormorant Garamond", Garamond, "Noto Serif SC", "Songti SC", "Times New Roman", serif;
    --font-sans: "StyreneB", Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --display-weight: 500;

    /* spacing（基础步长 4px） */
    --space-xxs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px;
    --space-lg: 24px; --space-xl: 32px; --space-xxl: 48px; --space-section: 96px;

    /* radius：按钮与输入框 8px，内容卡片 12px，大容器 16px */
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-pill: 9999px;
    /* 与设计系统同名的圆角别名，值仍取上面的短名 */
    --radius-lg: var(--r-lg);
    --radius-pill: var(--r-pill);
    --radius-full: var(--r-pill);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--canvas);
    color: var(--body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--canvas); }
  .hidden { display: none !important; }

  /* 登录视图：按微信小程序手机页来排，不按电脑网页 */
  body:has(#loginView:not(.hidden)) { background: #e5e5e5; }
  body:has(#loginView:not(.hidden)) .app {
    max-width: 390px;
    border: none;
    background: #f7f7f7;
  }

  .login-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    min-height: 100vh;
    padding: 0;
    background: #f7f7f7;
    color: rgba(0, 0, 0, 0.9);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .wx-nav {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 96px 0 16px;
    background: #f7f7f7;
    flex-shrink: 0;
  }
  .wx-nav-title {
    font-size: 17px;
    font-weight: 500;
    line-height: 44px;
    color: rgba(0, 0, 0, 0.9);
  }
  /* 右上角胶囊仅作小程序外观，不可点击 */
  .wx-capsule {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    height: 32px;
    border: 0.5px solid rgba(0, 0, 0, 0.15);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.6);
    overflow: hidden;
  }
  .wx-capsule button {
    width: 47px;
    height: 32px;
    border: none;
    background: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    pointer-events: none;
  }
  .wx-capsule-divider {
    width: 0.5px;
    height: 18px;
    background: rgba(0, 0, 0, 0.15);
  }
  .wx-capsule svg { width: 16px; height: 16px; }

  .wx-login-body { padding: 48px 24px 32px; }

  .wx-login-heading {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    color: rgba(0, 0, 0, 0.9);
    margin-bottom: 32px;
  }

  .login-form { width: 100%; }
  .login-fields {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
  }

  .login-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 0 16px;
    background: #fff;
  }
  .login-row + .login-row {
    border-top: 0.5px solid rgba(0, 0, 0, 0.1);
  }

  .region-code {
    flex-shrink: 0;
    font-size: 17px;
    font-weight: 400;
    color: rgba(0, 0, 0, 0.9);
  }
  .row-divider {
    width: 0.5px;
    height: 18px;
    background: rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
  }

  .login-row input[type="tel"],
  .login-row input[type="text"] {
    flex: 1;
    min-width: 0;
    width: auto;
    border: none;
    outline: none;
    background: transparent;
    padding: 0;
    font-size: 17px;
    font-family: inherit;
    color: rgba(0, 0, 0, 0.9);
    line-height: 1.4;
  }
  .login-row input::placeholder { color: rgba(0, 0, 0, 0.3); opacity: 1; }

  .btn-code-inline {
    background: none;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    color: #07c160;
    font-size: 17px;
    font-weight: 400;
    font-family: inherit;
    white-space: nowrap;
    padding: 8px 0 8px 12px;
  }
  .btn-code-inline:active { opacity: 0.6; }
  .btn-code-inline:disabled { color: rgba(0, 0, 0, 0.3); cursor: not-allowed; opacity: 1; }

  .login-view .field-error,
  .login-view .error-msg {
    font-size: 14px;
    color: #fa5151;
    margin-top: 12px;
    padding: 0 4px;
  }
  .login-view .field-error:empty,
  .login-view .error-msg:empty { display: none; }

  .login-view .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    margin-top: 32px;
    padding: 0;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 500;
    font-family: inherit;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }
  .login-view .btn-primary {
    background: #07c160;
    color: #fff;
  }
  .login-view .btn-primary:active { background: #06ad56; }
  .login-view .btn-primary:disabled {
    background: rgba(7, 193, 96, 0.4);
    color: #fff;
    cursor: not-allowed;
  }

  /* ============ 主视图：收集箱骨架 ============ */
  .main-view { flex: 1; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-sm) var(--space-md);
  }
  /* button-icon-circular：36 × 36，画布上用奶油卡拉开层次 */
  .btn-icon-circular {
    width: 36px; height: 36px; padding: 0; border: none;
    border-radius: var(--radius-full);
    background: var(--color-surface-card); color: var(--color-ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: var(--font-sans); flex-shrink: 0;
  }
  .btn-icon-circular:active { background: var(--color-surface-cream-strong); }
  .btn-icon-circular svg { width: 18px; height: 18px; }

  /* 本页唯一标题：display-sm，衬线、负字距、不加粗 */
  .page-title {
    font-family: var(--font-display); font-size: 28px; font-weight: var(--display-weight);
    letter-spacing: -.3px; line-height: 1.2; color: var(--color-ink);
    padding: var(--space-sm) var(--space-md) 0; margin-bottom: var(--space-lg);
  }

  /* --- 任务列表区 --- */
  .list { flex: 1; padding: 0 var(--space-md) calc(var(--space-section) + var(--space-xxl) + var(--space-md)); }

  /* 点 + 才出现的添加行，不常驻在顶部 */
  .add-row {
    background: var(--color-surface-card); border-radius: var(--radius-lg);
    padding: var(--space-sm) var(--space-md); margin-bottom: var(--space-xs);
    display: flex; align-items: center;
  }
  .add-row input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 16px; font-family: var(--font-sans); color: var(--color-ink); line-height: 1.55;
  }

  .todo-item {
    background: var(--color-surface-card); border: none; border-radius: var(--radius-lg);
    padding: var(--space-sm) var(--space-md); display: flex; align-items: center;
    gap: var(--space-sm); margin-bottom: var(--space-xs);
    animation: slideIn .22s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .checkbox {
    width: 20px; height: 20px; border-radius: var(--r-sm);
    border: 1.5px solid var(--color-surface-cream-strong);
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, background-color .15s ease; color: transparent;
  }
  .checkbox:active { border-color: var(--color-ink); }
  .checkbox svg { width: 11px; height: 11px; }
  .todo-item.done .checkbox { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-on-primary); }
  .todo-text {
    flex: 1; min-width: 0; font-size: 16px; line-height: 1.55; word-break: break-word;
    color: var(--color-ink); font-family: var(--font-sans);
  }
  .todo-item.done .todo-text { color: var(--color-muted); text-decoration: line-through; }
  .btn-del {
    background: none; border: none; color: var(--color-muted-soft); cursor: pointer;
    padding: var(--space-xxs); flex-shrink: 0; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .btn-del:active { color: var(--color-ink); }

  /* 悬浮层与 .app 同宽，作为导航和 + 的定位锚点 */
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: var(--space-lg); width: 100%; max-width: 560px; height: 0;
    pointer-events: none; z-index: 30;
  }
  .bottom-nav {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: var(--space-xxs);
    padding: var(--space-xs); background: var(--color-surface-dark);
    border-radius: var(--radius-pill); pointer-events: auto;
  }
  .nav-btn {
    width: 40px; height: 40px; padding: 0; border: none; border-radius: var(--radius-full);
    background: transparent; color: var(--color-on-dark); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-sans);
  }
  .nav-btn svg { width: 20px; height: 20px; }
  .nav-btn:active { background: var(--color-surface-dark-elevated); }
  .nav-btn.is-current { background: var(--color-primary); color: var(--color-on-primary); }
  .nav-btn.is-current:active { background: var(--color-primary-active); }

  .fab {
    position: absolute; right: var(--space-md); bottom: calc(var(--space-xxl) + var(--space-lg));
    width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full);
    background: var(--color-primary); color: var(--color-on-primary);
    font-family: var(--font-sans); font-size: 28px; font-weight: 400; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; pointer-events: auto;
  }
  .fab:active { background: var(--color-primary-active); }

  /* 全局提示：深色面 + 胶囊圆角 */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: var(--color-surface-dark); color: var(--color-on-dark); padding: 11px 22px; border-radius: var(--r-pill);
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 999;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--color-error); }
  /* 主视图里提示上移，避开底部胶囊导航 */
  body:has(.main-view:not(.hidden)) .toast { bottom: var(--space-section); }

  @media (min-width: 600px) {
    .app { border-left: 1px solid var(--color-hairline); border-right: 1px solid var(--color-hairline); min-height: 100vh; }
  }
  </style>
</head>

        <button class="nav-btn" type="button" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </nav>
      <button class="fab" id="addBtn" type="button" data-page-node-id="tE1vZm8ljWKCWiC3FPdMHL">+</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-page-node-id="cJkCPg8EAl8nZQAmmun5lX"></div>

<script>
(function () {
  var cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: "https://today-todo-99131.app.workbuddy.host",
    oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
    publishableKey: "wbpk_UU7TdoISAoZuBRmNHn903f_p43OwbQku6XtW2MHFxurod3W6Mkj4mfo"
  });

  var $ = function (id) { return document.getElementById(id); };
  var loginView = $('loginView'), mainView = $('mainView');
  var phoneInput = $('phone'), codeInput = $('code');
  var pendingOtp = null;
  var todos = [];

  // 悬浮「+」兼作新增行的开关与提交键，避免在顶部常驻输入框
  var addOpen = false;
  function setAddOpen(open) {
    addOpen = open;
    $('addRow').classList.toggle('hidden', !open);
    if (open) $('newTodo').focus();
  }

  // 提示
  var toastTimer = null;
  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function showLoginError(msg) { $('loginError').textContent = msg || ''; }

  // 手机号：3-4-4 空格分组显示，提交时还原为纯数字
  function formatPhone(value) {
    var d = value.replace(/\D/g, '').slice(0, 11);
    var parts = [];
    if (d.length > 0) parts.push(d.slice(0, 3));
    if (d.length > 3) parts.push(d.slice(3, 7));
    if (d.length > 7) parts.push(d.slice(7, 11));
    return parts.join(' ');
  }
  function getPhoneDigits() { return phoneInput.value.replace(/\D/g, ''); }

  // 输入时分组格式化，并保持光标位置
  phoneInput.addEventListener('input', function () {
    var el = this;
    var cursor = el.selectionStart || 0;
    var digitsBefore = el.value.slice(0, cursor).replace(/\D/g, '').length;
    var formatted = formatPhone(el.value);
    el.value = formatted;
    var pos = 0, count = 0;
    while (pos < formatted.length && count < digitsBefore) {
      if (/\d/.test(formatted.charAt(pos))) count++;
      pos++;
    }
    try { el.setSelectionRange(pos, pos); } catch (e) {}
    $('phoneError').textContent = '';
  });

  // 获取验证码
  var countdown = 0, cdTimer = null;
  $('sendCodeBtn').addEventListener('click', function () {
    var phone = getPhoneDigits();
    if (!/^1\d{10}$/.test(phone)) {
      $('phoneError').textContent = '请输入正确的 11 位手机号';
      return;
    }
    $('phoneError').textContent = '';
    var btn = $('sendCodeBtn');
    btn.disabled = true;
    showLoginError('');
    cloud.auth.sendOtp({ phone: phone }).then(function (res) {
      if (res.error) {
        btn.disabled = false;
        showLoginError(res.error.message || '验证码发送失败，请重试');
        return;
      }
      pendingOtp = { phone: phone, verificationId: res.data.verificationId, isExistingUser: res.data.isExistingUser };
      toast('验证码已发送');
      startCountdown(btn);
    }).catch(function () {
      btn.disabled = false;
      showLoginError('网络异常，请稍后重试');
    });
  });

  function startCountdown(btn) {
    countdown = 60;
    btn.textContent = countdown + 's';
    cdTimer = setInterval(function () {
      countdown--;
      if (countdown <= 0) {
        clearInterval(cdTimer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = countdown + 's';
      }
    }, 1000);
  }

  // 登录 / 注册
  $('loginBtn').addEventListener('click', function () {
    var phone = getPhoneDigits();
    var code = codeInput.value.trim();
    if (!/^1\d{10}$/.test(phone)) {
      $('phoneError').textContent = '请输入正确的 11 位手机号';
      return;
    }
    if (!code) { showLoginError('请输入验证码'); return; }
    if (!pendingOtp || pendingOtp.phone !== phone) {
      showLoginError('请先获取当前手机号的验证码');
      return;
    }
    var btn = $('loginBtn');
    btn.disabled = true;
    showLoginError('');
    cloud.auth.verifyOtp({
      phone: pendingOtp.phone,
      verificationId: pendingOtp.verificationId,
      isExistingUser: pendingOtp.isExistingUser,
      token: code
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) {
        showLoginError(res.error.message || '验证码错误或已过期');
        return;
      }
      pendingOtp = null;
      enterApp();
    }).catch(function () {
      btn.disabled = false;
      showLoginError('网络异常，请稍后重试');
    });
  });

  // 回车快捷提交
  codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

  // 退出
  $('logoutBtn').addEventListener('click', function () {
    cloud.auth.signOut().then(function () {
      pendingOtp = null;
      todos = [];
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
      phoneInput.value = '';
      codeInput.value = '';
    });
  });

  function enterApp() {
    loginView.classList.add('hidden');
    mainView.classList.remove('hidden');
    loadTodos();
  }

  // 加载任务
  function loadTodos() {
    $('todoList').innerHTML = '';
    cloud.database.from('todos').select('*').order('created_at', { ascending: true })
      .then(function (res) {
        if (res.error) {
          toast('加载失败，请重试', true);
          return;
        }
        todos = res.data || [];
        render();
      }).catch(function () {
        toast('网络异常，请重试', true);
      });
  }

  function render() {
    var list = $('todoList');
    list.innerHTML = '';
    todos.forEach(function (t) {
      list.appendChild(buildItem(t));
    });
  }

  function buildItem(t) {
    var div = document.createElement('div');
    div.className = 'todo-item' + (t.done ? ' done' : '');
    div.dataset.id = t.id;

    var cb = document.createElement('div');
    cb.className = 'checkbox';
    cb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    cb.addEventListener('click', function () { toggleTodo(t); });

    var txt = document.createElement('div');
    txt.className = 'todo-text';
    txt.textContent = t.title;

    var del = document.createElement('button');
    del.className = 'btn-del';
    del.title = '删除';
    del.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>';
    del.addEventListener('click', function () { deleteTodo(t); });

    div.appendChild(cb);
    div.appendChild(txt);
    div.appendChild(del);
    return div;
  }

  // 添加任务
  function addTodo() {
    var input = $('newTodo');
    var title = input.value.trim();
    if (!title) {
      toast('任务内容不能为空', true);
      return;
    }
    var btn = $('addBtn');
    btn.disabled = true;
    cloud.database.from('todos').insert({ title: title }).select()
      .then(function (res) {
        btn.disabled = false;
        if (res.error) {
          toast('添加失败，请重试', true);
          return;
        }
        if (res.data && res.data[0]) {
          todos.push(res.data[0]);
          render();
          input.value = '';
          setAddOpen(false);
        }
      }).catch(function () {
        btn.disabled = false;
        toast('网络异常，请重试', true);
      });
  }

  $('addBtn').addEventListener('click', function () {
    if (!addOpen) { setAddOpen(true); return; }
    addTodo();
  });
  $('newTodo').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addTodo();
    if (e.key === 'Escape') setAddOpen(false);
  });

  // 切换完成状态
  function toggleTodo(t) {
    var newDone = !t.done;
    cloud.database.from('todos').update({ done: newDone }).eq('id', t.id).select()
      .then(function (res) {
        if (res.error) { toast('操作失败，请重试', true); return; }
        if (Array.isArray(res.data) && res.data.length === 0) { toast('操作失败', true); return; }
        t.done = newDone;
        render();
      }).catch(function () { toast('网络异常，请重试', true); });
  }

  // 删除任务
  function deleteTodo(t) {
    cloud.database.from('todos').delete().eq('id', t.id).select()
      .then(function (res) {
        if (res.error) { toast('删除失败，请重试', true); return; }
        if (Array.isArray(res.data) && res.data.length === 0) { toast('删除失败', true); return; }
        todos = todos.filter(function (x) { return x.id !== t.id; });
        render();
        toast('已删除');
      }).catch(function () { toast('网络异常，请重试', true); });
  }

  // 启动：恢复会话
  cloud.auth.getSession().then(function (res) {
    if (res.error || !res.data) {
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
      return;
    }
    enterApp();
  }).catch(function () {
    loginView.classList.remove('hidden');
    mainView.classList.add('hidden');
  });
})();
</script>
</body>
</html>
